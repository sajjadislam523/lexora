name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    # `labeled` lets the owner's approval label start the merge checkpoint (see the merge job);
    # `ready_for_review` lets a draft feature PR merge once it is marked ready (see merge-feature).
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  # Label events get their own group, so adding an unrelated label can't cancel a running check.
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'checks' }}
  cancel-in-progress: true

jobs:
  verify:
    # Unrelated labels don't re-run the suite; the approval label does, as the final checkpoint.
    if: github.event.action != 'labeled' || github.event.label.name == 'owner-approved'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lexora
          POSTGRES_DB: lexora
          # Disposable CI database reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexora -d lexora"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    # CI-only configuration. Real secrets live in Vercel / Neon, never in the repository.
    env:
      DATABASE_URL: postgres://lexora@localhost:5432/lexora
      BETTER_AUTH_URL: http://localhost:3000
      # Account email goes to a local folder the tests read; CI never sends real email.
      EMAIL_TRANSPORT: outbox

    steps:
      # Majors that run on Node 24; GitHub is retiring Node 20 for actions.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Generate a throwaway auth secret for this run
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Validate authored content
        run: pnpm content:check
      - name: Apply migrations to a fresh database
        run: pnpm db:migrate
      - name: Fail if the schema changed without a migration
        run: |
          pnpm db:generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changes are missing a migration. Run pnpm db:generate and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Import the content into the fresh database
        run: pnpm content:import
      - name: Re-import to prove the import is repeatable
        run: pnpm content:import | tee import.log && grep -q "nothing to import" import.log
      - run: pnpm test
      - run: pnpm build
      - name: End-to-end route checks against the production build
        run: |
          # Own process group, so the whole server tree (pnpm → sh → next-server) stops with the step
          # instead of being left for the runner to clean up as orphans.
          setsid pnpm start > next.log 2>&1 &
          server=$!
          trap 'kill -TERM -- "-$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          pnpm test:e2e || (cat next.log; exit 1)

  # Final checkpoint (docs/WORKFLOW.md → Approve): when the owner adds the `owner-approved` label
  # to a phase PR into main, the full suite above runs again on that exact commit, and only then
  # is the PR merged and the release tagged. Claude Code never applies this label.
  merge:
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'owner-approved' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'phase/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Merge the approved commit
        # --match-head-commit refuses to merge if anything was pushed after the label was added.
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"

      - name: Tag the phase release
        # phase/3-language-engine → v0.3.0, phase/2.1-public-discovery → v0.2.1
        run: |
          phase="${HEAD_REF#phase/}"
          phase="${phase%%-*}"
          major="${phase%%.*}"
          minor=0
          if [ "$phase" != "$major" ]; then minor="${phase#*.}"; fi
          tag="v0.${major}.${minor}"
          merge_sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f message="$PR_TITLE" \
            -f object="$merge_sha" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_sha" > /dev/null
          echo "Merged PR #$PR and tagged $tag"

  # Feature auto-merge (docs/WORKFLOW.md → Feature auto-merge): a feat/fix/docs/chore PR into a
  # phase branch is merged into it with a merge commit as soon as the full suite passes on its
  # latest commit. Drafts are held until marked ready. No label, no tag: a phase is released, and
  # reaches main, only through the owner's checkpoint above.
  merge-feature:
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action) &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.base.ref, 'phase/') &&
      (startsWith(github.event.pull_request.head.ref, 'feat/') ||
       startsWith(github.event.pull_request.head.ref, 'fix/') ||
       startsWith(github.event.pull_request.head.ref, 'docs/') ||
       startsWith(github.event.pull_request.head.ref, 'chore/')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Merge the verified commit into the phase branch
        # --match-head-commit refuses to merge if anything was pushed after this run started;
        # the newer push starts its own run, which cancels this one (see concurrency).
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
