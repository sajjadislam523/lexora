senses:
  - key: advance
    pos: verb
    definition: To grow or change into something more advanced, or to build up a skill, product or idea.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-1, speaking-3] }
    topics: [economy, education]
    best_when: Skills, countries, technology and products that become more advanced over time.
    examples:
      - id: ex1
        text: Team sports help children develop social skills.
        highlight: develop
        skill: writing
        task: writing-2
        practice:
          accept: [build, improve, acquire]
      - id: ex2
        text: Developing countries often lack the funds to build modern infrastructure.
        highlight: Developing countries
        skill: writing
        task: writing-2
        collocation: countries
      - id: ex3
        text: I'd like to develop my career in marketing.
        highlight: develop
        skill: speaking
        task: speaking-1
        practice:
          accept: [build, grow]
    collocations:
      - id: countries
        phrase: developing countries
        note: 'poorer and richer economies; prefer these to "poor countries"; also "developed countries"'
    relations:
      - type: alternative
        to: improve.better
        weight: 1
        note: Improve means become better; develop means become more advanced, complete or skilled.
