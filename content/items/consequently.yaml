id: consequently
kind: linker
headword: consequently
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: consequently, type: lemma }
senses:
  - key: result
    pos: adverb
    definition: As a result of what has just been described.
    cefr: B2
    registers: [academic, formal]
    skills: [writing]
    ielts: { relevance: core, tasks: [writing-1, writing-2] }
    functions: [result]
    linker:
      connects: sentences
      positions: [start, middle]
      punctuation: A comma after it at the start of a sentence; between commas or after the subject in the middle.
    best_when: An effect that follows from events or a situation — common in Task 2 body paragraphs.
    examples:
      - id: ex1
        text: Many factories closed in the 1980s. Consequently, unemployment rose sharply.
        highlight: Consequently,
        skill: writing
        task: writing-2
        practice:
          accept: [as a result, therefore]
      - id: ex2
        text: Rents have doubled, and young people are consequently staying at home for longer.
        highlight: consequently
        skill: writing
        task: writing-2
        practice:
          accept: [therefore, as a result]
    mistakes:
      - id: consequence-linker
        wrong: Consequence, prices increased.
        right: Consequently, prices increased.
        type: word_form
        explanation: Consequence is a noun. Use the adverb "consequently", or "As a consequence,".
    relations:
      - type: synonym
        to: as-a-result.result
        weight: 2
        note: As a result is slightly less formal and very common in both skills.
