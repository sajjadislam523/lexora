id: allow
kind: word
headword: allow
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: allow, type: lemma }
  - { form: allows, type: inflection }
  - { form: allowed, type: inflection }
  - { form: allowing, type: inflection }
senses:
  - key: permit
    pos: verb
    definition: To let someone do something, or to make it possible for something to happen.
    cefr: B1
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-1, speaking-3] }
    best_when: Rules and permission ("be allowed to"), or things that make something possible.
    examples:
      - id: ex1
        text: Flexible hours allow parents to spend more time with their children.
        highlight: allow
        skill: writing
        task: writing-2
        practice:
          accept: [enable, help]
      - id: ex2
        text: We weren't allowed to use phones at my school.
        highlight: allowed
        skill: speaking
        task: speaking-1
        practice:
          accept: [permitted]
    mistakes:
      - id: allow-to
        wrong: The internet allows to work from anywhere.
        right: The internet allows people to work from anywhere.
        type: grammar
        explanation: Allow needs an object before "to" — allow someone to do something. Or use "allow" + -ing (allows working from anywhere).
    relations:
      - type: alternative
        to: enable.make-possible
        weight: 2
        note: Enable means making something possible; allow can also mean giving permission.
