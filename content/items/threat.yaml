id: threat
kind: word
headword: threat
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: threat, type: lemma }
  - { form: threats, type: inflection }
senses:
  - key: danger
    pos: noun
    definition: Something or someone likely to cause harm or damage.
    cefr: B2
    registers: [academic, neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [problem]
    topics: [environment, health, society]
    best_when: Serious possible harm — "a threat to wildlife", "a major threat to public health".
    examples:
      - id: ex1
        text: Rising sea levels are a serious threat to coastal communities.
        highlight: threat to
        skill: writing
        task: writing-2
        pattern: to
        practice:
          accept: [danger, risk]
      - id: ex2
        text: I think pollution is the biggest threat to our health.
        highlight: threat to
        skill: speaking
        task: speaking-3
        pattern: to
        practice:
          accept: [danger, risk]
    preposition_patterns:
      - id: to
        base: threat
        preposition: to
        pattern: a threat to + noun
        complement: noun
        note: what is in danger
        mistake: for
    collocations:
      - id: pose
        phrase: pose a threat
        item: pose-a-threat
      - id: serious
        phrase: a serious threat
        note: 'also "a major threat"'
    mistakes:
      - id: for
        wrong: Plastic is a threat for marine life.
        right: Plastic is a threat to marine life.
        type: preposition
        explanation: '"A threat to" + what is in danger.'
    relations:
      - type: alternative
        to: concern.worry
        weight: 1
        note: A concern is a worry people have; a threat is something likely to cause real harm.
