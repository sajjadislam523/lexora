id: refer-to
kind: preposition_pattern
headword: refer to
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: refer to, type: lemma }
  - { form: refers to, type: inflection }
  - { form: referred to, type: inflection }
  - { form: referring to, type: inflection }
senses:
  - key: mention
    pos: verb_phrase
    definition: To mention someone or something, or to be about them.
    cefr: B2
    registers: [academic, neutral]
    skills: [writing, speaking]
    ielts: { relevance: high, tasks: [writing-1, writing-2, speaking-3] }
    best_when: Saying what a term or figure means — "The figures refer to adults over 18".
    examples:
      - id: ex1
        text: The figures in the table refer to people aged over 65.
        highlight: refer to
        skill: writing
        task: writing-1
        pattern: to
      - id: ex2
        text: When I say family, I'm referring to my grandparents too.
        highlight: referring to
        skill: speaking
        task: speaking-2
        pattern: to
    preposition_patterns:
      - id: to
        base: refer
        preposition: to
        pattern: refer to + noun
        complement: noun
        note: what is mentioned or meant
        mistake: about
    mistakes:
      - id: about
        wrong: The article refers about climate change.
        right: The article refers to climate change.
        type: preposition
        explanation: Refer always takes "to".
