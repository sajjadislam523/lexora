senses:
  - key: quality
    pos: adjective
    definition: Of a low standard, unpleasant, or causing harm.
    cefr: A2
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-1, speaking-3] }
    strength: 1
    best_when: Speaking about experiences, habits and things you dislike.
    avoid_when: Writing an essay. Say how something is bad — it causes harm (harmful), it has bad effects (negative, detrimental), it is low in quality (poor).
    examples:
      - id: ex1
        text: Staying up late is bad for your concentration the next day.
        highlight: bad for
        skill: speaking
        task: speaking-1
        pattern: for
        practice:
          accept: [terrible, awful]
      - id: ex2
        text: Air pollution is bad for children's lungs.
        highlight: bad for
        skill: writing
        task: writing-2
        pattern: for
    preposition_patterns:
      - id: for
        base: bad
        preposition: for
        pattern: bad for + noun
        complement: noun
        note: what something harms
    mistakes:
      - id: more-bad
        wrong: Traffic is more bad than last year.
        right: Traffic is worse than last year.
        type: grammar
        explanation: Bad is irregular — bad, worse, worst.
    relations:
      - type: more_formal
        to: harmful.damaging
        weight: 1
        note: Harmful means it causes damage — to health, the environment or people.
      - type: more_formal
        to: negative.bad
        weight: 1
        note: Negative suits effects, consequences and attitudes.
      - type: more_formal
        to: detrimental.damaging
        weight: 1
        note: Detrimental is formal and means harmful to something's success or health.
