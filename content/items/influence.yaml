id: influence
kind: word
headword: influence
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: influence, type: lemma }
  - { form: influences, type: inflection }
  - { form: influenced, type: inflection }
  - { form: influencing, type: inflection }
senses:
  - key: noun
    label: an effect on behaviour
    pos: noun
    definition: The power to affect how someone thinks or behaves, or how something develops.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [cause]
    best_when: Effects on people's choices, opinions and behaviour — parents, media, peers, advertising.
    examples:
      - id: ex1
        text: Advertising has a strong influence on what children want to eat.
        highlight: influence on
        skill: writing
        task: writing-2
        pattern: on
        practice:
          accept: [effect, impact]
      - id: ex2
        text: My grandfather was a big influence on me when I was growing up.
        highlight: influence on
        skill: speaking
        task: speaking-2
        pattern: on
    preposition_patterns:
      - id: on
        base: influence
        preposition: on
        pattern: (have) an influence on + noun / person
        complement: noun
        note: who or what is influenced
    collocations:
      - id: strong
        phrase: a strong influence
        note: 'also "a powerful influence"'
      - id: peer
        phrase: peer influence
        note: the effect of friends of the same age
    relations:
      - type: alternative
        to: impact.noun
        weight: 1
        note: Impact is a strong, often direct effect; influence works gradually or indirectly.
  - key: verb
    label: to affect
    pos: verb
    definition: To affect how someone thinks or behaves, or how something develops.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [cause]
    best_when: Saying that something shapes decisions, opinions or behaviour.
    examples:
      - id: ex1
        text: Celebrities can influence young people's attitudes to their bodies.
        highlight: influence
        skill: writing
        task: writing-2
        practice:
          accept: [affect, shape]
      - id: ex2
        text: My parents influenced my decision to study engineering.
        highlight: influenced
        skill: speaking
        task: speaking-2
        practice:
          accept: [affected, shaped]
    mistakes:
      - id: on
        wrong: Friends influence on our choices.
        right: Friends influence our choices.
        type: preposition
        explanation: The verb takes a direct object. Use "on" only after the noun (an influence on).
    relations:
      - type: derived_form
        to: influence.noun
        weight: 2
        note: 'The noun: "have an influence on".'
