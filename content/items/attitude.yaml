id: attitude
kind: word
headword: attitude
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: attitude, type: lemma }
  - { form: attitudes, type: inflection }
senses:
  - key: feeling
    pos: noun
    definition: The way someone thinks and feels about something, which shows in how they behave.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: high, tasks: [writing-1, writing-2, speaking-3] }
    best_when: Survey results and social change — "attitudes to / towards", "a positive attitude".
    examples:
      - id: ex1
        text: Attitudes towards working from home have changed since 2020.
        highlight: Attitudes towards
        skill: writing
        task: writing-2
        pattern: towards
        practice:
          accept_preposition: [to]
      - id: ex2
        text: I think a positive attitude is more important than talent.
        highlight: positive attitude
        skill: speaking
        task: speaking-3
    preposition_patterns:
      - id: towards
        base: attitude
        preposition: towards
        pattern: an attitude to / towards + noun
        complement: noun
        note: '"to" and "towards" are both correct; "toward" in American English'
    relations:
      - type: alternative
        to: viewpoint.opinion
        weight: 1
        note: A point of view is an opinion; an attitude is a way of feeling and behaving towards something.
