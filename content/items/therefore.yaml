id: therefore
kind: linker
headword: therefore
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: therefore, type: lemma }
senses:
  - key: result
    pos: adverb
    definition: For that reason; as a logical result of what has just been said.
    cefr: B1
    registers: [academic, neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [result]
    linker:
      connects: sentences
      positions: [start, middle]
      punctuation: A comma after it at the start of a sentence. In the middle it usually follows the verb "be" or a modal, with or without commas ("it is therefore essential").
    best_when: Drawing a logical conclusion from the facts or argument before it.
    avoid_when: Joining two clauses with only a comma. Start a new sentence or use "and therefore" or a semicolon.
    skill_note: In Speaking, "so" is far more natural.
    examples:
      - id: ex1
        text: Older drivers have more experience. Therefore, they tend to have fewer accidents.
        highlight: Therefore,
        skill: writing
        task: writing-2
        practice:
          accept: [consequently, as a result, thus]
      - id: ex2
        text: Public transport is overcrowded. It is therefore essential to invest in new lines.
        highlight: therefore
        skill: writing
        task: writing-2
        practice:
          accept: [thus]
      - id: ex3
        text: I live far from the centre, and therefore I spend a lot of time on buses.
        highlight: therefore
        skill: speaking
        task: speaking-1
        practice:
          accept: [so]
    mistakes:
      - id: comma-splice
        wrong: Housing is expensive, therefore many young people rent.
        right: Housing is expensive; therefore, many young people rent.
        type: punctuation
        explanation: Therefore can't join two clauses with only a comma. Use a semicolon, a full stop, or "and therefore".
    relations:
      - type: synonym
        to: consequently.result
        weight: 2
        note: Consequently focuses on what happened next as a result; therefore on a logical conclusion.
      - type: alternative
        to: as-a-result.result
        weight: 2
        note: As a result describes a real-world effect; therefore can also introduce a logical conclusion.
      - type: more_formal
        to: thus.result
        weight: 2
        note: Thus is more formal and often comes before an -ing clause (thus reducing costs).
