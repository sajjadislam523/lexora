        wrong: It was a very value experience.
        right: It was a very valuable experience.
        type: word_form
        explanation: Value is the noun or verb; valuable is the adjective.
    relations:
      - type: alternative
        to: beneficial.helpful
        weight: 1
        note: Beneficial means it has good effects; valuable means it is worth a lot to someone.
