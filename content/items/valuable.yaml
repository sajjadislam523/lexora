    best_when: Experience, skills, advice, time and lessons that are worth a lot to someone.
    examples:
      - id: ex1
        text: Part-time work gives students valuable experience of the workplace.
        highlight: valuable experience
        skill: writing
        task: writing-2
        collocation: experience
        practice:
          accept: [useful, practical]
      - id: ex2
        text: My first job taught me a valuable lesson about responsibility.
        highlight: valuable lesson
        skill: speaking
        task: speaking-2
        practice:
          accept: [useful]
    collocations:
      - id: experience
        phrase: valuable experience
        note: 'also "valuable skills"'
      - id: resource
        phrase: a valuable resource
    mistakes:
