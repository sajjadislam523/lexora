        text: My grandmother always insists on cooking when we visit.
        highlight: insists on
        skill: speaking
        task: speaking-2
        pattern: on
    preposition_patterns:
      - id: on
        base: insist
        preposition: on
        pattern: insist on + -ing / noun
        complement: noun_or_ing
        note: or "insist that + clause"
        mistake: to
    mistakes:
      - id: to
        wrong: He insisted to pay for dinner.
        right: He insisted on paying for dinner.
        type: grammar
        explanation: Insist is followed by "on" + -ing, or by "that" + clause.
