id: contrast
kind: word
headword: contrast
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: contrast, type: lemma }
  - { form: contrasts, type: inflection }
  - { form: contrasted, type: inflection }
  - { form: contrasting, type: inflection }
senses:
  - key: noun
    label: a clear difference
    pos: noun
    definition: A clear difference between two or more people or things that are compared.
    cefr: B2
    registers: [academic, neutral]
    skills: [writing]
    ielts: { relevance: core, tasks: [writing-1, writing-2] }
    functions: [contrast, comparison]
    best_when: Highlighting a striking difference — "a sharp contrast between", "in contrast to".
    examples:
      - id: ex1
        text: There is a sharp contrast between the incomes of the richest and poorest households.
        highlight: contrast between
        skill: writing
        task: writing-1
        pattern: between
      - id: ex2
        text: In contrast to the UK, Spain saw a rise in rail travel.
        highlight: In contrast to
        skill: writing
        task: writing-1
        pattern: to
    preposition_patterns:
      - id: between
        base: contrast
        preposition: between
        pattern: a contrast between + A + and + B
        complement: noun
        note: the two things compared
      - id: to
        base: contrast
        preposition: to
        pattern: in contrast to / with + noun
        complement: noun
        note: introduces the thing that is different
    relations:
      - type: related
        to: in-contrast.difference
  - key: verb
    label: to compare
    pos: verb
    definition: To compare two things in order to show the differences between them, or to be clearly different.
    cefr: B2
    registers: [academic]
    skills: [writing]
    ielts: { relevance: high, tasks: [writing-1, writing-2] }
    functions: [contrast, comparison]
    best_when: '"Contrast A with B", and "this contrasts with" to point out a difference.'
    examples:
      - id: ex1
        text: The rise in Asia contrasts with a steady fall in Europe.
        highlight: contrasts with
        skill: writing
        task: writing-1
        pattern: with
      - id: ex2
        text: This essay will contrast city life with life in the countryside.
        highlight: contrast
        skill: writing
        task: writing-2
        practice:
          accept: [compare]
    preposition_patterns:
      - id: with
        base: contrast
        preposition: with
        pattern: contrast (A) with B
        complement: noun
        note: the thing that is different
    relations:
      - type: derived_form
        to: contrast.noun
        weight: 1
        note: The same word as a noun.
