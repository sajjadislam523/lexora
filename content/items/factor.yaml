id: factor
kind: word
headword: factor
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: factor, type: lemma }
  - { form: factors, type: inflection }
senses:
  - key: influence
    pos: noun
    definition: One of several things that influence a situation or result.
    cefr: B2
    registers: [academic, neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [cause]
    best_when: Discussing several causes carefully — "a key factor in", "a number of factors".
    examples:
      - id: ex1
        text: Cost is a major factor in choosing where to study.
        highlight: factor in
        skill: writing
        task: writing-2
        pattern: in
      - id: ex2
        text: For me, location is the most important factor when choosing a flat.
        highlight: factor
        skill: speaking
        task: speaking-3
    preposition_patterns:
      - id: in
        base: factor
        preposition: in
        pattern: a factor in + noun / -ing
        complement: noun_or_ing
        note: what it influences
        mistake: of
    collocations:
      - id: key
        phrase: a key factor
        note: 'also "a major factor"'
      - id: number
        phrase: a number of factors
        note: several causes, said carefully
    mistakes:
      - id: of
        wrong: a key factor of success
        right: a key factor in success
        type: preposition
        explanation: '"A factor in" + what is influenced.'
    relations:
      - type: alternative
        to: cause.noun
        weight: 2
        note: A cause makes something happen; a factor is one influence among several.
