id: the-majority-of
kind: phrase
headword: the majority of
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: the majority of, type: lemma }
  - { form: a majority of, type: lemma }
senses:
  - key: most
    pos: noun_phrase
    definition: More than half of a group of people or things.
    cefr: B2
    registers: [academic, neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-1, writing-2, speaking-3] }
    best_when: Saying that more than half of a group did or thinks something — formal but not stiff.
    skill_note: '"Most people" is more natural in Speaking.'
    examples:
      - id: ex1
        text: The majority of respondents said they used public transport every day.
        highlight: The majority of
        skill: writing
        task: writing-1
      - id: ex2
        text: The majority of people in my country live in cities now.
        highlight: The majority of
        skill: speaking
        task: speaking-3
    collocations:
      - id: vast
        phrase: the vast majority of
        note: almost all
      - id: minority
        phrase: a small minority of
        note: the opposite — fewer than half, often far fewer
    mistakes:
      - id: agreement
        wrong: The majority of students thinks the fees are too high.
        right: The majority of students think the fees are too high.
        type: grammar
        explanation: With a plural noun after "the majority of", the verb is plural.
    relations:
      - type: alternative
        to: proportion.part
        weight: 1
        note: A proportion is any part of a whole; the majority is more than half.
