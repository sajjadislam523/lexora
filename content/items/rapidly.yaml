id: rapidly
kind: word
headword: rapidly
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: rapidly, type: lemma }
senses:
  - key: fast
    pos: adverb
    definition: Very quickly, in a short period of time.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-1, writing-2, speaking-3] }
    best_when: Fast change or growth — technology, cities, populations, markets.
    examples:
      - id: ex1
        text: The number of people shopping online grew rapidly between 2010 and 2020.
        highlight: grew rapidly
        skill: writing
        task: writing-1
        practice:
          accept: [quickly, sharply, dramatically]
      - id: ex2
        text: Technology is developing so rapidly that schools struggle to keep up.
        highlight: developing so rapidly
        skill: writing
        task: writing-2
        practice:
          accept: [quickly, fast]
      - id: ex3
        text: My city is growing rapidly, so there's construction everywhere.
        highlight: growing rapidly
        skill: speaking
        task: speaking-1
        practice:
          accept: [quickly, fast]
    collocations:
      - id: rapid
        phrase: rapid growth
        note: 'the adjective form with a noun; also "rapid change"'
      - id: changing
        phrase: a rapidly changing world
        note: a common, useful Task 2 phrase
    relations:
      - type: alternative
        to: dramatically.large
        weight: 1
        note: Rapidly is about speed; dramatically is about size.
