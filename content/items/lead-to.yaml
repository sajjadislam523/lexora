id: lead-to
kind: preposition_pattern
headword: lead to
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: lead to, type: lemma }
  - { form: leads to, type: inflection }
  - { form: led to, type: inflection }
  - { form: leading to, type: inflection }
senses:
  - key: cause
    pos: verb_phrase
    definition: To cause something to happen, often as one step in a series of events.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [cause, result]
    best_when: Linking a cause to its effect in one sentence — the most flexible cause-and-effect verb.
    examples:
      - id: ex1
        text: Cheap flights have led to a huge increase in tourism.
        highlight: led to
        skill: writing
        task: writing-2
        pattern: to
      - id: ex2
        text: Poor diet can lead to serious health problems later in life.
        highlight: lead to
        skill: writing
        task: writing-2
        pattern: to
      - id: ex3
        text: Spending too much time online can lead to people feeling lonely.
        highlight: lead to
        skill: speaking
        task: speaking-3
        pattern: to
    preposition_patterns:
      - id: to
        base: lead
        preposition: to
        pattern: lead to + noun / -ing
        complement: noun_or_ing
        note: '"to" is a preposition here, so a verb after it takes -ing'
        mistake: base-verb
    mistakes:
      - id: base-verb
        wrong: This could lead to increase crime.
        right: This could lead to an increase in crime.
        type: grammar
        explanation: After "lead to", use a noun or an -ing form, not the base form of a verb.
      - id: leaded
        wrong: The new law leaded to protests.
        right: The new law led to protests.
        type: grammar
        explanation: Lead is irregular — lead, led, led.
    relations:
      - type: synonym
        to: result-in.cause
        weight: 2
        note: Result in is slightly more formal and focuses on the final outcome.
      - type: alternative
        to: cause.verb
        weight: 2
        note: Cause names a direct cause; lead to can describe a chain of events.
