id: likely
kind: word
headword: likely
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: likely, type: lemma }
  - { form: unlikely, type: lemma }
senses:
  - key: probable
    pos: adjective
    definition: Probably going to happen or be true.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-1, writing-2, speaking-3] }
    functions: [hedging]
    best_when: Making a careful prediction — "be likely to", "it is likely that". The negative is "unlikely".
    examples:
      - id: ex1
        text: Older people are less likely to use online banking.
        highlight: likely to
        skill: writing
        task: writing-1
        collocation: likely-to
      - id: ex2
        text: Without investment, the problem is likely to get worse.
        highlight: likely to
        skill: writing
        task: writing-2
        collocation: likely-to
      - id: ex3
        text: I think it's unlikely that people will stop using cars completely.
        highlight: unlikely
        skill: speaking
        task: speaking-3
    collocations:
      - id: likely-to
        phrase: be likely to
        pattern: be (more / less) likely to + verb
        note: the most useful pattern; compare groups in Task 1
      - id: highly
        phrase: highly likely
        note: 'also "highly unlikely"'
    mistakes:
      - id: infinitive
        wrong: Prices are likely rise next year.
        right: Prices are likely to rise next year.
        type: grammar
        explanation: '"Be likely" is followed by "to" + verb.'
