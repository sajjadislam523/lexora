id: claim
kind: word
headword: claim
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: claim, type: lemma }
  - { form: claims, type: inflection }
  - { form: claimed, type: inflection }
  - { form: claiming, type: inflection }
senses:
  - key: state
    pos: verb
    definition: To say that something is true, although there may be no proof and others may disagree.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: high, tasks: [writing-2, speaking-3] }
    functions: [opinion]
    best_when: Reporting a view you may want to question — "Critics claim that …, but …".
    avoid_when: You agree with the view. "Claim" can sound doubtful; use "argue" or "point out".
    examples:
      - id: ex1
        text: Advertisers claim that their products improve health, but the evidence is weak.
        highlight: claim
        skill: writing
        task: writing-2
        practice:
          accept: [argue, insist, assert, maintain]
      - id: ex2
        text: Some people claim that video games make children violent.
        highlight: claim
        skill: speaking
        task: speaking-3
        practice:
          accept: [say, argue, believe]
    relations:
      - type: alternative
        to: assert.state
        weight: 1
        note: Assert states something very confidently and firmly.
