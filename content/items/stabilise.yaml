senses:
  - key: steady
    pos: verb
    definition: To become steady and stop changing, especially after a period of rises and falls.
    cefr: C1
    registers: [academic, neutral]
    skills: [writing]
    ielts: { relevance: high, tasks: [writing-1, writing-2] }
    best_when: A line that becomes steady after fluctuating, or a situation that becomes calm after change.
    examples:
      - id: ex1
        text: After several years of fluctuation, prices stabilised at around $300.
        highlight: stabilised
        skill: writing
        task: writing-1
        practice:
          accept: [plateaued]
      - id: ex2
        text: The economy began to stabilise once interest rates were lowered.
        highlight: stabilise
        skill: writing
        task: writing-2
    relations:
      - type: alternative
        to: level-off.stop-changing
        weight: 2
        note: Stabilise often follows a period of rises and falls; level off follows one clear rise or fall.
      - type: alternative
        to: remain-stable.stable
        weight: 2
        note: Remain stable describes the whole period; stabilise describes the moment it became steady.
