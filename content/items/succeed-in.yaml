id: succeed-in
kind: preposition_pattern
headword: succeed in
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: succeed in, type: lemma }
  - { form: succeeds in, type: inflection }
  - { form: succeeded in, type: inflection }
  - { form: succeeding in, type: inflection }
senses:
  - key: manage
    pos: verb_phrase
    definition: To manage to do something you have tried to do.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: high, tasks: [writing-2, speaking-2] }
    best_when: Achieving an aim — "succeed in + -ing".
    examples:
      - id: ex1
        text: The campaign succeeded in reducing plastic waste by a third.
        highlight: succeeded in
        skill: writing
        task: writing-2
        pattern: in
      - id: ex2
        text: I finally succeeded in passing my driving test on the third try.
        highlight: succeeded in
        skill: speaking
        task: speaking-2
        pattern: in
    preposition_patterns:
      - id: in
        base: succeed
        preposition: in
        pattern: succeed in + -ing / noun
        complement: noun_or_ing
        note: what was achieved
        mistake: to
    mistakes:
      - id: to
        wrong: The council succeeded to reduce traffic.
        right: The council succeeded in reducing traffic.
        type: grammar
        explanation: Succeed is followed by "in" + -ing, not "to" + verb. Or use "managed to reduce".
