id: in-addition
kind: linker
headword: in addition
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: in addition, type: lemma }
  - { form: in addition to, type: lemma }
senses:
  - key: addition
    pos: prepositional_phrase
    definition: Used to add another point; with "to" + noun or -ing, it adds something to what is mentioned.
    cefr: B1
    registers: [academic, formal]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-1, writing-2, speaking-3] }
    functions: [addition]
    linker:
      connects: sentences
      positions: [start, middle]
      punctuation: A comma after it at the start of a sentence. "In addition to" + noun needs no comma before the noun.
    best_when: Adding a second argument in Task 2 — a little less formal than "furthermore" and very safe.
    examples:
      - id: ex1
        text: Cycling is cheap. In addition, it keeps people fit.
        highlight: In addition,
        skill: writing
        task: writing-2
        practice:
          accept: [Moreover, Furthermore, Additionally, What is more]
      - id: ex2
        text: In addition to reducing pollution, trams are quieter than buses.
        highlight: In addition to
        skill: writing
        task: writing-2
        practice:
          accept: [As well as, Besides]
      - id: ex3
        text: The job pays well. In addition, I get to travel.
        highlight: In addition,
        skill: speaking
        task: speaking-1
        practice:
          accept: [On top of that, What's more, Also]
    mistakes:
      - id: base-verb
        wrong: In addition to reduce costs, the plan saves time.
        right: In addition to reducing costs, the plan saves time.
        type: grammar
        explanation: '"To" is a preposition in "in addition to", so a verb after it takes -ing.'
    relations:
      - type: synonym
        to: furthermore.addition
        weight: 2
        note: Furthermore is more formal and often introduces a stronger point.
