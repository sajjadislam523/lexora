id: also
kind: linker
headword: also
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: also, type: lemma }
senses:
  - key: addition
    pos: adverb
    definition: In addition; used to add a fact or idea, usually in the middle of a sentence.
    cefr: A2
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-1, speaking-3] }
    functions: [addition]
    linker:
      connects: sentences
      positions: [middle]
      punctuation: No commas in the middle — before the main verb, after "be" or after the first auxiliary (it is also cheap; they have also found).
    best_when: Adding a detail inside a sentence — natural in both skills.
    avoid_when: Starting a written sentence with "Also,". In an essay, "In addition," is more formal.
    examples:
      - id: ex1
        text: Trains are faster than buses, and they are also more comfortable.
        highlight: also
        skill: writing
        task: writing-2
      - id: ex2
        text: I love my job, and I also get on really well with my colleagues.
        highlight: also
        skill: speaking
        task: speaking-1
    mistakes:
      - id: position
        wrong: They also are cheaper.
        right: They are also cheaper.
        type: grammar
        explanation: Put "also" after the verb "be" — they are also, it is also.
    relations:
      - type: more_formal
        to: in-addition.addition
        weight: 2
        note: '"In addition," at the start of a sentence is the more formal way to add a point.'
