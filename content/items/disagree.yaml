id: disagree
kind: word
headword: disagree
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: disagree, type: lemma }
  - { form: disagrees, type: inflection }
  - { form: disagreed, type: inflection }
  - { form: disagreeing, type: inflection }
senses:
  - key: different-view
    pos: verb
    definition: To have a different opinion from someone, or to think an idea is wrong.
    cefr: B1
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [opinion]
    best_when: Rejecting a view clearly, with "with" for the person or idea.
    examples:
      - id: ex1
        text: I disagree with the view that older people cannot learn new technology.
        highlight: disagree with
        skill: writing
        task: writing-2
        pattern: with
      - id: ex2
        text: I completely disagree with people who say exams are pointless.
        highlight: disagree with
        skill: speaking
        task: speaking-3
        pattern: with
    preposition_patterns:
      - id: with
        base: disagree
        preposition: with
        pattern: disagree with + person / idea / view
        complement: noun
        note: also "disagree about / on" + the topic
        mistake: to
    mistakes:
      - id: to
        wrong: I disagree to this idea.
        right: I disagree with this idea.
        type: preposition
        explanation: '"Disagree with" + the person or idea.'
      - id: be-disagree
        wrong: I am disagree with the statement.
        right: I disagree with the statement.
        type: grammar
        explanation: Disagree is a verb, so it doesn't need "am".
