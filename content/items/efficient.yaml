id: efficient
kind: word
headword: efficient
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: efficient, type: lemma }
senses:
  - key: no-waste
    pos: adjective
    definition: Working well without wasting time, money or energy.
    cefr: B2
    registers: [academic, neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    topics: [technology, work, environment]
    best_when: Systems, machines, workers and processes that get results with little waste — "energy-efficient", "more efficient".
    examples:
      - id: ex1
        text: Trains are a more efficient way of moving goods than lorries.
        highlight: more efficient
        skill: writing
        task: writing-2
      - id: ex2
        text: New buildings must be more energy-efficient than older ones.
        highlight: energy-efficient
        skill: writing
        task: writing-2
        collocation: energy
      - id: ex3
        text: I try to be efficient and answer emails in the morning.
        highlight: efficient
        skill: speaking
        task: speaking-1
        practice:
          accept: [organised, organized, productive]
    collocations:
      - id: energy
        phrase: energy-efficient
        note: using little energy — homes, cars, appliances
      - id: use
        phrase: the efficient use of
        pattern: the efficient use of + resources / energy / time
    mistakes:
      - id: efficient-noun
        wrong: The factory improved its efficient.
        right: The factory improved its efficiency.
        type: word_form
        explanation: Efficient is the adjective; efficiency is the noun.
    relations:
      - type: alternative
        to: practical.realistic
        weight: 1
        note: Practical means it works in real conditions; efficient means it wastes little.
