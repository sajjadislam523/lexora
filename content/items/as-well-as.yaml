id: as-well-as
kind: functional_expression
headword: as well as
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: as well as, type: lemma }
senses:
  - key: addition
    pos: prepositional_phrase
    definition: And also; used before a noun or -ing form to add something.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [addition]
    best_when: Adding a second item inside one sentence — "as well as + noun / -ing".
    examples:
      - id: ex1
        text: Parks provide space for exercise as well as habitats for wildlife.
        highlight: as well as
        skill: writing
        task: writing-2
        practice:
          accept: [and also, in addition to]
      - id: ex2
        text: As well as being cheap, the bus is really convenient for me.
        highlight: As well as
        skill: speaking
        task: speaking-1
        practice:
          accept: [In addition to, Besides]
    mistakes:
      - id: base-verb
        wrong: As well as save money, cycling is healthy.
        right: As well as saving money, cycling is healthy.
        type: grammar
        explanation: At the start of a sentence, "as well as" is followed by a noun or an -ing form.
    relations:
      - type: alternative
        to: in-addition.addition
        weight: 2
        note: '"In addition to" works the same way and is slightly more formal.'
