id: limited
kind: word
headword: limited
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: limited, type: lemma }
senses:
  - key: small
    pos: adjective
    definition: Not very great in amount, effect or range, often less than is needed.
    cefr: B2
    registers: [academic, neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [hedging, problem]
    best_when: Resources, access, evidence or effects that are not enough — a careful, measured criticism.
    examples:
      - id: ex1
        text: Rural communities often have limited access to healthcare.
        highlight: limited access
        skill: writing
        task: writing-2
        collocation: access
        practice:
          accept: [poor, restricted]
      - id: ex2
        text: The new law has had only a limited effect on crime.
        highlight: limited effect
        skill: writing
        task: writing-2
        practice:
          accept: [small, minor, modest]
      - id: ex3
        text: There are limited options for nightlife where I live.
        highlight: limited options
        skill: speaking
        task: speaking-1
        practice:
          accept: [few]
    collocations:
      - id: access
        phrase: limited access to
        pattern: limited access to + noun
      - id: resources
        phrase: limited resources
        note: 'also "limited funding"'
    relations:
      - type: alternative
        to: negligible.tiny
        weight: 1
        note: Negligible means the effect can be ignored; limited means there is some, but not enough.
