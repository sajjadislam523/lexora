id: while
kind: linker
headword: while
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: while, type: lemma }
  - { form: whilst, type: lemma }
senses:
  - key: contrast
    pos: conjunction
    definition: Used to compare two facts or situations that are different; whereas.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-1, writing-2, speaking-3] }
    functions: [contrast, concession]
    linker:
      connects: clauses
      positions: [start, middle]
      punctuation: A comma between the two clauses, whether "while" starts the sentence or comes in the middle.
    best_when: Joining two contrasting facts in one sentence — very common in Task 1.
    avoid_when: The sentence could be read as "during the time that". Use "whereas" for a clear contrast.
    skill_note: '"Whilst" is a more formal British form with the same meaning.'
    examples:
      - id: ex1
        text: Car use fell in London, while it rose in most other cities.
        highlight: while
        skill: writing
        task: writing-1
        practice:
          accept: [whereas]
      - id: ex2
        text: While some people love city life, others prefer the peace of the countryside.
        highlight: While
        skill: speaking
        task: speaking-3
        practice:
          accept: [Whereas]
    relations:
      - type: synonym
        to: whereas.contrast
        weight: 2
        note: Whereas is slightly more formal and can only mean contrast; while can also mean "during".
