id: cope-with
kind: preposition_pattern
headword: cope with
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: cope with, type: lemma }
  - { form: copes with, type: inflection }
  - { form: coped with, type: inflection }
  - { form: coping with, type: inflection }
senses:
  - key: manage
    pos: verb_phrase
    definition: To deal successfully with a difficult situation or problem.
    cefr: B2
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-2, speaking-3] }
    functions: [problem]
    best_when: Managing pressure, stress or demand — "cope with stress", "hospitals can't cope with demand".
    examples:
      - id: ex1
        text: Hospitals are struggling to cope with rising demand.
        highlight: cope with
        skill: writing
        task: writing-2
        pattern: with
      - id: ex2
        text: I cope with stress by going for long walks.
        highlight: cope with
        skill: speaking
        task: speaking-1
        pattern: with
    preposition_patterns:
      - id: with
        base: cope
        preposition: with
        pattern: cope with + noun
        complement: noun
        note: the difficulty
        mistake: up-with
    mistakes:
      - id: up-with
        wrong: Students find it hard to cope up with exams.
        right: Students find it hard to cope with exams.
        type: preposition
        explanation: The standard phrase is "cope with", with no "up".
