id: participate-in
kind: preposition_pattern
headword: participate in
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: participate in, type: lemma }
  - { form: participates in, type: inflection }
  - { form: participated in, type: inflection }
  - { form: participating in, type: inflection }
senses:
  - key: take-part
    pos: verb_phrase
    definition: To take part in an activity or event.
    cefr: B2
    registers: [academic, formal]
    skills: [writing, speaking]
    ielts: { relevance: high, tasks: [writing-1, writing-2, speaking-3] }
    best_when: Formal writing about sport, surveys, elections and community life. "Take part in" is less formal.
    examples:
      - id: ex1
        text: The percentage of adults who participated in sport fell after 2015.
        highlight: participated in
        skill: writing
        task: writing-1
        pattern: in
      - id: ex2
        text: All students should participate in some form of volunteering.
        highlight: participate in
        skill: writing
        task: writing-2
        pattern: in
      - id: ex3
        text: I used to participate in a lot of school debates.
        highlight: participate in
        skill: speaking
        task: speaking-1
        pattern: in
    preposition_patterns:
      - id: in
        base: participate
        preposition: in
        pattern: participate in + noun / -ing
        complement: noun_or_ing
        note: the activity
        mistake: to
    mistakes:
      - id: to
        wrong: Many people participated to the survey.
        right: Many people participated in the survey.
        type: preposition
        explanation: Participate takes "in".
