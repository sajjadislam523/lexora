id: believe
kind: word
headword: believe
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: believe, type: lemma }
  - { form: believes, type: inflection }
  - { form: believed, type: inflection }
  - { form: believing, type: inflection }
senses:
  - key: think
    pos: verb
    definition: To think that something is true or right, often firmly.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [opinion]
    best_when: Stating your position in a Task 2 introduction or conclusion, and reporting widely held views ("it is widely believed that").
    examples:
      - id: ex1
        text: I firmly believe that governments should fund public libraries.
        highlight: firmly believe
        skill: writing
        task: writing-2
        practice:
          accept: [think]
      - id: ex2
        text: It is widely believed that children learn best through play.
        highlight: widely believed
        skill: writing
        task: writing-2
        practice:
          accept: [thought, accepted, held]
      - id: ex3
        text: I really believe that travelling makes people more open-minded.
        highlight: believe
        skill: speaking
        task: speaking-3
        practice:
          accept: [think, feel]
    collocations:
      - id: firmly
        phrase: firmly believe
        note: 'a confident position; also "strongly believe"'
      - id: widely
        phrase: it is widely believed that
        note: reports a common view without naming who holds it
    mistakes:
      - id: progressive
        wrong: I am believing that this is wrong.
        right: I believe that this is wrong.
        type: grammar
        explanation: Believe describes a state, so it isn't used in the continuous form.
    relations:
      - type: alternative
        to: argue.claim
        weight: 2
        note: Argue presents a view as part of a reasoned case; believe states your own conviction.
