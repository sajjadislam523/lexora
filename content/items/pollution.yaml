id: pollution
kind: word
headword: pollution
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: pollution, type: lemma }
senses:
  - key: harm
    pos: noun
    definition: Harmful substances in the air, water or land, or the process of making them dirty.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-1, writing-2, speaking-3] }
    topics: [environment, health, cities]
    best_when: Air, water, noise and plastic pollution — it is uncountable.
    examples:
      - id: ex1
        text: Air pollution is linked to millions of early deaths every year.
        highlight: Air pollution
        skill: writing
        task: writing-2
        collocation: air
      - id: ex2
        text: The pollution in my city is so bad that you can't see the mountains.
        highlight: pollution
        skill: speaking
        task: speaking-3
        practice:
          accept: [smog]
    collocations:
      - id: air
        phrase: reduce air pollution
        note: 'also "water pollution", "noise pollution"'
      - id: levels
        phrase: pollution levels
        note: the amount of pollution, useful in Task 1
    mistakes:
      - id: plural
        wrong: Cars cause a lot of pollutions.
        right: Cars cause a lot of pollution.
        type: countability
        explanation: Pollution is uncountable, so it has no plural.
    relations:
      - type: alternative
        to: emissions.gases
        weight: 2
        note: Emissions are gases released into the air; pollution is any harmful substance in air, water or land.
