id: reduce
kind: word
headword: reduce
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: reduce, type: lemma }
  - { form: reduces, type: inflection }
  - { form: reduced, type: inflection }
  - { form: reducing, type: inflection }
senses:
  - key: make-smaller
    pos: verb
    definition: To make something smaller in size, amount, number or degree.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [decrease]
    best_when: Someone deliberately makes a problem or cost smaller — "reduce pollution", "reduce the risk of".
    examples:
      - id: ex1
        text: Taxing sugary drinks could reduce obesity among children.
        highlight: reduce
        skill: writing
        task: writing-2
        practice:
          accept: [lower, cut, decrease]
      - id: ex2
        text: Working from home reduces the time people spend commuting.
        highlight: reduces
        skill: writing
        task: writing-2
        practice:
          accept: [cuts, decreases]
      - id: ex3
        text: I've reduced the amount of meat I eat for health reasons.
        highlight: reduced
        skill: speaking
        task: speaking-1
        practice:
          accept: [cut, cut down, decreased]
    collocations:
      - id: risk
        phrase: reduce the risk of
        pattern: reduce the risk of + noun / -ing
      - id: emissions
        phrase: reduce emissions
        note: 'also "reduce waste", "reduce costs"'
    relations:
      - type: opposite
        to: increase.verb
      - type: more_formal
        to: mitigate.reduce-harm
        weight: 1
        note: Mitigate is formal and used only for harm — risks, effects, damage.
      - type: alternative
        to: prevent.stop
        weight: 2
        note: Prevent stops something from happening at all; reduce makes it smaller.
