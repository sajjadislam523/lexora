id: provide
kind: word
headword: provide
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: provide, type: lemma }
  - { form: provides, type: inflection }
  - { form: provided, type: inflection }
  - { form: providing, type: inflection }
senses:
  - key: give
    pos: verb
    definition: To give someone something they need, or to make it available to them.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    best_when: Governments, schools and companies supplying services, money or support — "provide people with".
    examples:
      - id: ex1
        text: Governments should provide young people with affordable housing.
        highlight: provide young people with
        skill: writing
        task: writing-2
        pattern: with
      - id: ex2
        text: Libraries provide free access to books and the internet.
        highlight: provide
        skill: writing
        task: writing-2
        practice:
          accept: [offer, give]
      - id: ex3
        text: My company provides lunch for all its staff.
        highlight: provides
        skill: speaking
        task: speaking-1
        practice:
          accept: [offers, gives]
    preposition_patterns:
      - id: with
        base: provide
        preposition: with
        pattern: provide + person + with + noun
        complement: noun
        note: or "provide + thing + for + person"
        mistake: no-with
    mistakes:
      - id: no-with
        wrong: Schools should provide students free meals.
        right: Schools should provide students with free meals.
        type: preposition
        explanation: With the person first, provide needs "with". Or put the thing first — provide free meals for students.
    relations:
      - type: alternative
        to: offer.give
        weight: 2
        note: Offer means making something available for people to take; provide means actually supplying it.
