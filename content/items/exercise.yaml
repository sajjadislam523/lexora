      - id: ex1
        text: Regular exercise reduces the risk of many serious diseases.
        highlight: Regular exercise
        skill: writing
        task: writing-2
        collocation: regular
        practice:
          accept: [physical activity]
      - id: ex2
        text: I try to do some exercise every morning before work.
        highlight: do some exercise
        skill: speaking
        task: speaking-1
        collocation: do
    collocations:
      - id: regular
        phrase: regular exercise
      - id: do
        phrase: do exercise
        note: '"take exercise" is more British; also "take exercise"'
    mistakes:
      - id: make
        wrong: People should make more exercise.
        right: People should do more exercise.
        type: collocation
        explanation: In English you "do" or "take" exercise, not "make" it.
