id: possible
kind: word
headword: possible
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: possible, type: lemma }
senses:
  - key: could-happen
    pos: adjective
    definition: Able to happen or be done, though not certain.
    cefr: A2
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [hedging]
    best_when: Softening a claim or naming one option among several — "it is possible that", "one possible solution".
    examples:
      - id: ex1
        text: One possible solution is to offer tax breaks to companies that hire young people.
        highlight: possible solution
        skill: writing
        task: writing-2
      - id: ex2
        text: It's possible that I'll move abroad after I graduate.
        highlight: possible
        skill: speaking
        task: speaking-1
    collocations:
      - id: solution
        phrase: one possible solution
        note: a careful way to introduce a suggestion
      - id: as-possible
        phrase: as soon as possible
        note: 'to the greatest degree you can; also "as much as possible"'
    relations:
      - type: stronger
        to: likely.probable
        weight: 2
        note: Likely means it will probably happen; possible only means it could.
      - type: alternative
        to: feasible.possible
        weight: 1
        note: Feasible means a plan can realistically be carried out.
