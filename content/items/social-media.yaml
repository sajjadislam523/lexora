    pos: noun
    definition: Websites and apps that let people share content and communicate with each other.
    cefr: B1
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-1, speaking-3] }
    topics: [technology, society]
    best_when: Effects on teenagers, news, relationships and privacy — "on social media", "the use of social media".
    examples:
      - id: ex1
        text: Young people increasingly get their news from social media.
        highlight: social media
        skill: writing
        task: writing-2
