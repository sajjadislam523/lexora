        text: I spend too much time on social media, to be honest.
        highlight: on social media
        skill: speaking
        task: speaking-1
    mistakes:
      - id: in
        wrong: I saw it in social media.
        right: I saw it on social media.
        type: preposition
        explanation: Things are posted and seen "on" social media, like "on the internet".
      - id: plural
        wrong: Social medias are popular among teenagers.
        right: Social media is popular among teenagers.
        type: countability
        explanation: '"Media" is already plural in form, so there is no "medias". Use "social media" or name the platforms.'
