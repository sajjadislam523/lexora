id: oppose
kind: word
headword: oppose
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: oppose, type: lemma }
  - { form: opposes, type: inflection }
  - { form: opposed, type: inflection }
  - { form: opposing, type: inflection }
senses:
  - key: against
    pos: verb
    definition: To disagree strongly with a plan or policy and try to stop it.
    cefr: B2
    registers: [academic, neutral]
    skills: [writing, speaking]
    ielts: { relevance: high, tasks: [writing-2, speaking-3] }
    functions: [opinion]
    best_when: Saying who is against a policy — "oppose the plan", "be opposed to".
    examples:
      - id: ex1
        text: Many residents oppose the plan to build a new airport.
        highlight: oppose
        skill: writing
        task: writing-2
        practice:
          accept: [object to, reject]
      - id: ex2
        text: I'm opposed to testing cosmetics on animals.
        highlight: opposed to
        skill: speaking
        task: speaking-3
        collocation: opposed-to
        practice:
          accept: [against]
    collocations:
      - id: opposed-to
        phrase: be opposed to
        pattern: be opposed to + noun / -ing
        note: the adjective pattern; "to" is a preposition
      - id: strongly
        phrase: strongly oppose
    mistakes:
      - id: oppose-to
        wrong: Many people oppose to the new tax.
        right: Many people oppose the new tax.
        type: preposition
        explanation: The verb oppose takes a direct object. The adjective pattern is "be opposed to".
    relations:
      - type: opposite
        to: support.agree
      - type: alternative
        to: reject.refuse
        weight: 1
        note: Reject means refusing to accept an idea or offer; oppose means being against it and resisting it.
