id: solution
kind: word
headword: solution
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: solution, type: lemma }
  - { form: solutions, type: inflection }
senses:
  - key: answer
    pos: noun
    definition: A way of dealing successfully with a problem or difficult situation.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    best_when: Problem–solution essays — "a solution to the problem", "the most effective solution".
    examples:
      - id: ex1
        text: There is no simple solution to the problem of homelessness.
        highlight: solution to
        skill: writing
        task: writing-2
        pattern: to
        practice:
          accept: [answer]
      - id: ex2
        text: One practical solution would be to offer free bus travel to students.
        highlight: practical solution
        skill: writing
        task: writing-2
      - id: ex3
        text: I think the best solution to traffic is better public transport.
        highlight: solution to
        skill: speaking
        task: speaking-3
        pattern: to
        practice:
          accept: [answer]
    preposition_patterns:
      - id: to
        base: solution
        preposition: to
        pattern: a solution to + problem
        complement: noun
        note: '"for" is used for who it helps (a solution for families)'
        mistake: of
    collocations:
      - id: find
        phrase: find a solution
        note: 'also "propose a solution"'
      - id: long-term
        phrase: a long-term solution
        note: 'also "a practical solution"'
    mistakes:
      - id: of
        wrong: a solution of the problem
        right: a solution to the problem
        type: preposition
        explanation: '"A solution to" a problem.'
    relations:
      - type: alternative
        to: approach.method
        weight: 2
        note: An approach is a way of dealing with a problem, which may or may not solve it.
      - type: alternative
        to: remedy.cure
        weight: 1
        note: A remedy is a formal word for a solution that corrects something bad.
