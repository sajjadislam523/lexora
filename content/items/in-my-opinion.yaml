id: in-my-opinion
kind: functional_expression
headword: in my opinion
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: in my opinion, type: lemma }
  - { form: in my view, type: lemma }
senses:
  - key: opinion
    pos: prepositional_phrase
    definition: Used to introduce what you personally think about something.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [opinion]
    best_when: Stating your position clearly at the start of a sentence, once in the introduction and once in the conclusion.
    avoid_when: Combining it with "I think". One of them is enough.
    examples:
      - id: ex1
        text: In my opinion, the advantages of online learning outweigh the disadvantages.
        highlight: In my opinion,
        skill: writing
        task: writing-2
      - id: ex2
        text: In my view, the city should invest more in parks.
        highlight: In my view,
        skill: speaking
        task: speaking-3
    mistakes:
      - id: according-to-me
        wrong: According to me, the plan won't work.
        right: In my opinion, the plan won't work.
        type: confusion
        explanation: '"According to" introduces what other people or sources say. For your own view, use "in my opinion" or "in my view".'
      - id: double
        wrong: In my opinion, I think the plan won't work.
        right: In my opinion, the plan won't work.
        type: register
        explanation: '"In my opinion" and "I think" say the same thing; use one of them.'
    relations:
      - type: alternative
        to: viewpoint.opinion
        weight: 2
        note: '"From my point of view" is a slightly less formal way to introduce your view.'
      - type: has_component
        to: opinion.view
