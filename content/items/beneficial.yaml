        wrong: Exercise is very benefit for health.
        right: Exercise is very beneficial for health.
        type: word_form
        explanation: Benefit is the noun or verb; beneficial is the adjective.
    relations:
      - type: opposite
        to: harmful.damaging
      - type: alternative
        to: positive.good
        weight: 2
        note: Positive is more general; beneficial says that something actually helps.
