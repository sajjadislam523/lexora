id: knowledge
kind: word
headword: knowledge
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: knowledge, type: lemma }
senses:
  - key: know
    pos: noun
    definition: Information, understanding and skill that you get through learning or experience.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    topics: [education]
    best_when: '"Knowledge of" a subject, and "gain / share knowledge" — it is uncountable.'
    examples:
      - id: ex1
        text: A basic knowledge of first aid can save lives.
        highlight: knowledge of
        skill: writing
        task: writing-2
        collocation: of
        practice:
          accept: [understanding]
      - id: ex2
        text: My grandparents have a lot of knowledge about plants and farming.
        highlight: knowledge about
        skill: speaking
        task: speaking-2
    collocations:
      - id: of
        phrase: knowledge of
        pattern: (a good) knowledge of + subject
      - id: gain
        phrase: gain knowledge
        note: 'also "acquire knowledge", "share knowledge"'
    mistakes:
      - id: plural
        wrong: Students gain many knowledges at university.
        right: Students gain a lot of knowledge at university.
        type: countability
        explanation: Knowledge is uncountable, so it has no plural and isn't used with "many".
