id: agree
kind: word
headword: agree
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: agree, type: lemma }
  - { form: agrees, type: inflection }
  - { form: agreed, type: inflection }
  - { form: agreeing, type: inflection }
senses:
  - key: same-view
    pos: verb
    definition: To have the same opinion as someone, or to accept that an idea is right.
    cefr: A2
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [opinion]
    best_when: Answering "To what extent do you agree?" — say how far you agree ("I partly agree", "I strongly agree").
    examples:
      - id: ex1
        text: I strongly agree that cities should invest more in public transport.
        highlight: agree that
        skill: writing
        task: writing-2
      - id: ex2
        text: I agree with the idea that parents should limit screen time.
        highlight: agree with
        skill: writing
        task: writing-2
        pattern: with
      - id: ex3
        text: I agree with my friends that our town needs more for young people to do.
        highlight: agree with
        skill: speaking
        task: speaking-3
        pattern: with
    preposition_patterns:
      - id: with
        base: agree
        preposition: with
        pattern: agree with + person / idea / statement
        complement: noun
        note: '"agree on" means deciding something together; "agree to" means accepting a plan'
        mistake: to-idea
    collocations:
      - id: strongly
        phrase: strongly agree
        note: 'say how far you agree in Task 2; also "partly agree"'
      - id: extent
        phrase: agree to some extent
        item: to-some-extent
    mistakes:
      - id: be-agree
        wrong: I am agree with this opinion.
        right: I agree with this opinion.
        type: grammar
        explanation: Agree is a verb, so it doesn't need "am".
      - id: to-idea
        wrong: I agree to this statement.
        right: I agree with this statement.
        type: preposition
        explanation: Agree with an opinion or statement. "Agree to" means accepting a proposal or plan.
    relations:
      - type: opposite
        to: disagree.different-view
