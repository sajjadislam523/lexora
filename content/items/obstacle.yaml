id: obstacle
kind: word
headword: obstacle
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: obstacle, type: lemma }
  - { form: obstacles, type: inflection }
senses:
  - key: barrier
    pos: noun
    definition: Something that makes it difficult to do something or make progress.
    cefr: B2
    registers: [academic, neutral]
    skills: [writing, speaking]
    ielts: { relevance: high, tasks: [writing-2, speaking-3] }
    functions: [problem]
    best_when: Something that blocks a goal — "an obstacle to progress", "overcome obstacles".
    examples:
      - id: ex1
        text: High fees are a major obstacle to higher education for poorer students.
        highlight: obstacle to
        skill: writing
        task: writing-2
        pattern: to
        practice:
          accept: [barrier]
      - id: ex2
        text: Language was the main obstacle when I started working abroad.
        highlight: main obstacle
        skill: speaking
        task: speaking-2
        practice:
          accept: [barrier, problem, challenge]
    preposition_patterns:
      - id: to
        base: obstacle
        preposition: to
        pattern: an obstacle to + noun / -ing
        complement: noun_or_ing
        note: what is blocked
        mistake: for
    mistakes:
      - id: for
        wrong: Cost is an obstacle for progress.
        right: Cost is an obstacle to progress.
        type: preposition
        explanation: '"An obstacle to" + what is blocked; "for" + the people affected (an obstacle for students).'
