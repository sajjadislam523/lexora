id: work
kind: word
headword: work
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: work, type: lemma }
senses:
  - key: job
    pos: noun
    definition: The job someone does to earn money, or the place where they do it; uncountable in this meaning.
    cefr: A2
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-1, speaking-3] }
    topics: [work]
    best_when: Everyday speech about your job — "find work", "go to work", "at work".
    avoid_when: You need a countable noun. Say "a job", not "a work".
    examples:
      - id: ex1
        text: Many graduates struggle to find work in their field.
        highlight: find work
        skill: writing
        task: writing-2
        practice:
          accept: [employment, a job, jobs]
      - id: ex2
        text: I usually cycle to work when the weather's good.
        highlight: to work
        skill: speaking
        task: speaking-1
    mistakes:
      - id: a-work
        wrong: She is looking for a work in a bank.
        right: She is looking for a job in a bank.
        type: countability
        explanation: In this meaning, work is uncountable. Use "a job" for one position.
    relations:
      - type: alternative
        to: job.position
        weight: 1
        note: A job is countable — one paid position ("a job", "two jobs").
      - type: more_formal
        to: employment.having-work
        weight: 1
        note: Employment is formal and suits statistics and policy.
      - type: alternative
        to: career.long-term
        weight: 1
        note: A career is the series of jobs someone does over their working life.
