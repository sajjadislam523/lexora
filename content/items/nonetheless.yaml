      positions: [start, middle, end]
      punctuation: A comma after it at the start of a sentence; between commas in the middle.
    best_when: Accepting a point and then continuing with your argument — a formal alternative to "nevertheless".
    examples:
      - id: ex1
        text: The scheme is expensive. Nonetheless, its long-term benefits are clear.
