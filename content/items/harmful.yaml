id: harmful
kind: word
headword: harmful
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: harmful, type: lemma }
senses:
  - key: damaging
    pos: adjective
    definition: Causing damage or injury to people, things or the environment.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [problem]
    best_when: Effects on health, the environment or society — "harmful to", "harmful effects".
    examples:
      - id: ex1
        text: Some pesticides are harmful to bees and other insects.
        highlight: harmful to
        skill: writing
        task: writing-2
        pattern: to
        practice:
          accept: [damaging, dangerous]
      - id: ex2
        text: Too much screen time may have harmful effects on children's sleep.
        highlight: harmful effects
        skill: writing
        task: writing-2
        collocation: effects
        practice:
          accept: [damaging, negative, detrimental]
      - id: ex3
        text: I know junk food is harmful, but it's so convenient.
        highlight: harmful
        skill: speaking
        task: speaking-1
        practice:
          accept: [bad for you, unhealthy]
    preposition_patterns:
      - id: to
        base: harmful
        preposition: to
        pattern: harmful to + noun
        complement: noun
        note: what is damaged
        mistake: for
    collocations:
      - id: effects
        phrase: harmful effects
        pattern: harmful effects on + noun
      - id: substances
        phrase: harmful substances
        note: 'also "harmful emissions"'
    mistakes:
      - id: for
        wrong: Smoking is harmful for your lungs.
        right: Smoking is harmful to your lungs.
        type: preposition
        explanation: '"Harmful to" is the standard pattern in formal writing.'
    relations:
      - type: more_formal
        to: detrimental.damaging
        weight: 2
        note: Detrimental is more formal and often describes harm to success, development or health.
