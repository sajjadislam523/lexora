id: interested-in
kind: preposition_pattern
headword: interested in
status: draft
source: lexora-editorial
review: { author: claude }
forms:
  - { form: interested in, type: lemma }
senses:
  - key: want
    pos: adjective_phrase
    definition: Wanting to give attention to something, learn more about it or take part in it.
    cefr: A2
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [speaking-1, speaking-2, writing-2] }
    best_when: Talking about hobbies, studies and plans — a Speaking Part 1 essential.
    skill_note: In Speaking, "I'm really into …" is a relaxed alternative; keep "interested in" for Writing.
    examples:
      - id: ex1
        text: I've always been interested in photography.
        highlight: interested in
        skill: speaking
        task: speaking-1
        pattern: in
      - id: ex2
        text: Fewer young people are interested in following traditional careers.
        highlight: interested in
        skill: writing
        task: writing-2
        pattern: in
      - id: ex3
        text: I'm not really interested in sport, to be honest.
        highlight: interested in
        skill: speaking
        task: speaking-1
        pattern: in
    preposition_patterns:
      - id: in
        base: interested
        preposition: in
        pattern: be interested in + noun / -ing
        complement: noun_or_ing
        note: the topic or activity
        mistake: about
    mistakes:
      - id: about
        wrong: I'm interested about history.
        right: I'm interested in history.
        type: preposition
        explanation: Interested takes "in". "About" goes with words such as "curious about" or "excited about".
      - id: interesting
        wrong: I am interesting in art.
        right: I am interested in art.
        type: word_form
        explanation: Interested describes how you feel; interesting describes the thing that causes the feeling.
