id: object-to
kind: preposition_pattern
headword: object to
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: object to, type: lemma }
  - { form: objects to, type: inflection }
  - { form: objected to, type: inflection }
  - { form: objecting to, type: inflection }
senses:
  - key: disapprove
    pos: verb_phrase
    definition: To say that you do not approve of something or disagree with it.
    cefr: C1
    registers: [formal, neutral]
    skills: [writing, speaking]
    ielts: { relevance: useful, tasks: [writing-2, speaking-3] }
    functions: [opinion]
    best_when: Saying that people disapprove of a plan or practice, often formally.
    examples:
      - id: ex1
        text: Local residents objected to the construction of a new motorway.
        highlight: objected to
        skill: writing
        task: writing-2
        pattern: to
      - id: ex2
        text: Some parents object to their children using phones at school.
        highlight: object to
        skill: speaking
        task: speaking-3
        pattern: to
    preposition_patterns:
      - id: to
        base: object
        preposition: to
        pattern: object to + noun / -ing
        complement: noun_or_ing
        note: '"to" is a preposition, so a verb after it takes -ing'
        mistake: infinitive
    mistakes:
      - id: infinitive
        wrong: Residents object to build a new airport.
        right: Residents object to building a new airport.
        type: grammar
        explanation: After "object to", use a noun or an -ing form.
