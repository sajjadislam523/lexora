id: different
kind: word
headword: different
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: different, type: lemma }
senses:
  - key: not-same
    pos: adjective
    definition: Not the same as another thing or person.
    cefr: A2
    registers: [neutral]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-1, writing-2, speaking-1, speaking-3] }
    functions: [comparison, contrast]
    best_when: Any difference; add "very", "completely" or "slightly" to say how different.
    examples:
      - id: ex1
        text: The pattern for women was very different from that for men.
        highlight: different from
        skill: writing
        task: writing-1
        pattern: from
        practice:
          accept_preposition: [to]
      - id: ex2
        text: Life in the countryside is completely different from city life.
        highlight: different from
        skill: speaking
        task: speaking-3
        pattern: from
        practice:
          accept_preposition: [to]
    preposition_patterns:
      - id: from
        base: different
        preposition: from
        pattern: different from + noun
        complement: noun
        note: '"different to" is also common in British English, and "different than" in American English'
        mistake: with
    mistakes:
      - id: with
        wrong: My opinion is different with yours.
        right: My opinion is different from yours.
        type: preposition
        explanation: Use "different from" (or "different to" in British English), not "different with".
    relations:
      - type: derived_form
        to: differ.vary
        weight: 2
        note: 'The verb: "differ from", "differ in".'
