id: negative
kind: word
headword: negative
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: negative, type: lemma }
senses:
  - key: bad
    pos: adjective
    definition: Harmful or unpleasant in its effect, or not hopeful in attitude.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-2, speaking-3] }
    functions: [problem]
    best_when: Effects, consequences and attitudes — "negative consequences", "a negative impact on".
    examples:
      - id: ex1
        text: Fast fashion has serious negative consequences for the environment.
        highlight: negative consequences
        skill: writing
        task: writing-2
        collocation: consequences
        practice:
          accept: [harmful, damaging]
      - id: ex2
        text: Social media can have a negative effect on how teenagers see themselves.
        highlight: negative effect
        skill: speaking
        task: speaking-3
        collocation: impact
        practice:
          accept: [bad, harmful]
    collocations:
      - id: impact
        phrase: a negative impact
        pattern: have a negative impact on + noun
        note: 'also "a negative effect"'
      - id: consequences
        phrase: negative consequences
        pattern: negative consequences for + noun
    relations:
      - type: alternative
        to: harmful.damaging
        weight: 2
        note: Harmful says that something causes damage; negative is broader and also describes attitudes.
