id: clear
kind: word
headword: clear
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: clear, type: lemma }
senses:
  - key: obvious
    pos: adjective
    definition: Easy to see or understand, so there is no doubt.
    cefr: B1
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: core, tasks: [writing-1, writing-2, speaking-3] }
    functions: [emphasis]
    best_when: The overview of a Task 1 report ("Overall, it is clear that …") or a point no one disputes.
    examples:
      - id: ex1
        text: Overall, it is clear that renewable energy grew while coal declined.
        highlight: it is clear that
        skill: writing
        task: writing-1
        collocation: it-is
        practice:
          accept: [evident, apparent]
      - id: ex2
        text: There is a clear link between poverty and poor health.
        highlight: clear link
        skill: writing
        task: writing-2
        practice:
          accept: [strong, direct, close]
      - id: ex3
        text: It's clear that tourism is really important for my town.
        highlight: clear
        skill: speaking
        task: speaking-3
        practice:
          accept: [obvious]
    collocations:
      - id: it-is
        phrase: it is clear that
        pattern: (Overall,) it is clear that + clause
        note: a standard Task 1 overview opener
      - id: trend
        phrase: a clear trend
        note: 'also "a clear link", "a clear difference"'
    relations:
      - type: synonym
        to: obvious.easy-to-see
        weight: 2
        note: Obvious can sound as if the reader should already know; clear is more neutral.
      - type: more_formal
        to: evident.clear
        weight: 2
        note: Evident is more formal and suggests the evidence shows it.
