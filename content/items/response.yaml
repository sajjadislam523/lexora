id: response
kind: word
headword: response
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: response, type: lemma }
  - { form: responses, type: inflection }
senses:
  - key: reaction
    pos: noun
    definition: Something said or done as a reaction to something else.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: high, tasks: [writing-2, speaking-3] }
    best_when: How governments or people react — "in response to", "a response to the crisis".
    examples:
      - id: ex1
        text: The law was introduced in response to rising crime.
        highlight: in response to
        skill: writing
        task: writing-2
        pattern: to
      - id: ex2
        text: The government's response to the floods was far too slow.
        highlight: response to
        skill: speaking
        task: speaking-3
        pattern: to
        practice:
          accept: [reaction]
    preposition_patterns:
      - id: to
        base: response
        preposition: to
        pattern: (in) response to + noun
        complement: noun
        note: what is being reacted to
        mistake: for
    mistakes:
      - id: for
        wrong: The council's response for the complaints was quick.
        right: The council's response to the complaints was quick.
        type: preposition
        explanation: '"A response to" + what someone reacts to.'
    relations:
      - type: alternative
        to: solution.answer
        weight: 1
        note: A response is any action taken because of a problem; a solution actually solves it.
