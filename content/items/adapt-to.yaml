id: adapt-to
kind: preposition_pattern
headword: adapt to
status: published
source: lexora-editorial
review: { author: claude, reviewer: owner, on: 2026-10-24, level: editorial }
forms:
  - { form: adapt to, type: lemma }
  - { form: adapts to, type: inflection }
  - { form: adapted to, type: inflection }
  - { form: adapting to, type: inflection }
senses:
  - key: adjust
    pos: verb_phrase
    definition: To change your behaviour or ideas so that you can deal with a new situation.
    cefr: B2
    registers: [neutral, academic]
    skills: [writing, speaking]
    ielts: { relevance: high, tasks: [writing-2, speaking-2, speaking-3] }
    best_when: New environments, technology and cultures — "adapt to change", "adapt to life abroad".
    examples:
      - id: ex1
        text: Older workers may find it harder to adapt to new technology.
        highlight: adapt to
        skill: writing
        task: writing-2
        pattern: to
      - id: ex2
        text: It took me a few months to adapt to the weather here.
        highlight: adapt to
        skill: speaking
        task: speaking-2
        pattern: to
    preposition_patterns:
      - id: to
        base: adapt
        preposition: to
        pattern: adapt to + noun / -ing
        complement: noun_or_ing
        note: the new situation
        mistake: with
    mistakes:
      - id: with
        wrong: Students must adapt with a new culture.
        right: Students must adapt to a new culture.
        type: preposition
        explanation: '"Adapt to" + the new situation.'
