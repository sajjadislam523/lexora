# Local development database only. Production uses Neon (see README.md).
services:
  postgres:
    image: postgres:17-alpine
    container_name: lexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexora
      POSTGRES_PASSWORD: lexora
      POSTGRES_DB: lexora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lexora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexora -d lexora"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  lexora-postgres:
