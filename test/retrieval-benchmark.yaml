# The retrieval benchmark (Phase 6B): representative learner queries and the language a good
# answer puts first. It measures ranking quality; the golden suite (search-golden.yaml) pins exact
# behaviour. Run it with `pnpm test:retrieval`; the report is test/retrieval-benchmark-report.txt.
#
# Each entry in expected / acceptable / rejected is an item slug (content/items/<slug>.yaml) or an
# authored term exactly as a result shows it (a collocation, "base preposition" of a pattern). The
# runner refuses a reference the content doesn't have, so nothing here is invented.
#
#   query       what the learner types
#   category    one of the categories in the report
#   intent      the query shape the engine must read (optional)
#   expected    the best answers: one of them should be first
#   acceptable  also correct, so they may come first without failing the case
#   rejected    wrong for this query: never in the top 3, never above the first expected answer
#
# A case passes when the first result is expected or acceptable, an expected result is in the top
# 3, no rejected result breaks its rule, and the intent (when given) matches.
#
# Expectations describe the right answer, not what the engine happens to return: when the engine
# and a case disagree, fix the engine or justify the case in its comment.

# ── Basic lexical ───────────────────────────────────────────────────────────────────────────

- { query: important, category: basic-lexical, intent: LOOKUP, expected: [important] }
- { query: increase, category: basic-lexical, intent: LOOKUP, expected: [increase] }
- { query: good, category: basic-lexical, intent: LOOKUP, expected: [good] }
- { query: bad, category: basic-lexical, intent: LOOKUP, expected: [bad] }
- { query: think, category: basic-lexical, intent: LOOKUP, expected: [think] }
