- { query: decrease, category: basic-lexical, intent: LOOKUP, expected: [decrease] }
- { query: analyze, category: basic-lexical, intent: LOOKUP, expected: [analyse] }
- { query: signifcant, category: basic-lexical, intent: LOOKUP, expected: [significant] }
- { query: responsable for, category: basic-lexical, intent: LOOKUP, expected: [responsible-for] }
- { query: depend on, category: basic-lexical, intent: LOOKUP, expected: [depend-on] }
- {
    query: a significant increase,
    category: basic-lexical,
    intent: LOOKUP,
    expected: [significant],
  }

