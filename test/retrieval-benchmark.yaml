# ── Context gaps ────────────────────────────────────────────────────────────────────────────

# A preposition goes between "suffer" and its object; a verb can't ("suffer reduce poverty").
- query: suffer ___ poverty
  category: context-gap
  intent: CONTEXT_GAP
  expected: [suffer from]
  rejected: [reduce poverty, alleviate poverty]

- query: responsible ___ the problem
  category: context-gap
  intent: CONTEXT_GAP
  expected: [responsible for]

- query: contribute ___ society
  category: context-gap
  intent: CONTEXT_GAP
  expected: [contribute to]

- query: depend ___ public transport
  category: context-gap
  intent: CONTEXT_GAP
  expected: [depend on]

# A preposition before "in 2020" would make two prepositions in a row: the gap wants an adverb.
- query: Prices rose ___ in 2020.
  category: context-gap
  intent: CONTEXT_GAP
  expected: [rose sharply, rise dramatically, rise gradually, rise steadily]
  rejected: [rise in, rise by, rise to]

# Here a noun phrase follows the gap, so an adverb can't go there ("rose sharply 2020").
- query: prices rose ___ 2020
  category: context-gap
  intent: CONTEXT_GAP
  expected: [rise in, rise by, rise to]
  rejected: [rose sharply, rise dramatically, rise gradually, rise steadily]

- query: Governments should ____ more money into public transportation
  category: context-gap
  intent: CONTEXT_GAP
  expected: [invest]
  acceptable: [allocate]

- query: The government is responsible ___ providing healthcare.
  category: context-gap
  intent: CONTEXT_GAP
  expected: [responsible for]

- query: Many people depend ___ their cars.
  category: context-gap
  intent: CONTEXT_GAP
  expected: [depend on]

- query: The government took ___ to reduce crime
  category: context-gap
  intent: CONTEXT_GAP
  expected: [take-measures]

- query: Public transport plays a ___ role
  category: context-gap
  intent: CONTEXT_GAP
  expected: [play-a-crucial-role, crucial, key, vital]
  acceptable: [major, significant]

- query: Screen time has a ___ effect on sleep
  category: context-gap
  intent: CONTEXT_GAP
  expected: [have-a-detrimental-effect-on]
  acceptable: [beneficial, harmful, effect]

- query: Plastic waste ___ a threat to marine life
  category: context-gap
  intent: CONTEXT_GAP
  expected: [pose-a-threat]

- query: Plastic waste poses a threat ___ marine life
  category: context-gap
  intent: CONTEXT_GAP
  expected: [pose-a-threat]

- query: The council allocated money ___ education
  category: context-gap
  intent: CONTEXT_GAP
  expected: [allocate]

- query: Schools raised awareness ___ the dangers
  category: context-gap
  intent: CONTEXT_GAP
  expected: [raise-awareness]

- query: She devoted her life ___ helping others
  category: context-gap
  intent: CONTEXT_GAP
  expected: [devote]

- query: There was a ___ increase in prices
  category: context-gap
  intent: CONTEXT_GAP
  expected: [significant, substantial, a sharp increase, a gradual increase, a marked increase]
  acceptable: [a slight increase]

- query: Prices rose, ___ demand fell
  category: context-gap
  intent: CONTEXT_GAP
  expected: [whereas, while]
  acceptable: [although, even-though]

